name: Auto-fix variable calls

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Corriger les appels de variables
        run: |
          cp index.js index.js.bak
          sed -i 's/\bfirebaseApp()/firebaseApp/g' index.js
          sed -i 's/\bredisClient()/redisClient/g' index.js
          sed -i 's/\bmetrics()/metrics/g' index.js
          if node --check index.js; then
            rm index.js.bak
            echo "✅ Syntaxe OK"
          else
            mv index.js.bak index.js
            echo "❌ Erreur, restauration"
            exit 1
          fi

      - name: Commit et push
        run: |
          git config user.name "Auto-Fix Bot"
          git config user.email "bot@users.noreply.github.com"
          git add index.js
          if git diff --staged --quiet; then
            echo "Rien à corriger"
          else
            git commit -m "🤖 Auto-fix: variables sans parenthèses"
            git push
          fi