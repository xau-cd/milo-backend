# nginx.conf — Luba v17 (compatible SSE / WebSocket / réflexions longues)
# CAUSE n°4 des « Luba indisponible » : sans ces réglages, nginx coupe à 60 s et met les tokens en tampon.
worker_processes auto;
events { worker_connections 8192; }
http {
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  upstream luba { server luba:3000; keepalive 64; }
  limit_req_zone $binary_remote_addr zone=perip:20m rate=60r/s;

  server {
    listen 80;
    client_max_body_size 12m;

    location / {
      limit_req zone=perip burst=200 nodelay;
      proxy_pass http://luba;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Flux en direct : AUCUN tampon, délais très longs (le serveur envoie un heartbeat toutes les 12 s)
    location ~ ^/api/(chat|sync/stream|runs/.+/stream) {
      proxy_pass http://luba;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_cache off;
      gzip off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      chunked_transfer_encoding on;
      add_header X-Accel-Buffering no;
    }

    location ~ ^/(ws|live)$ {   # /ws = synchro v17 · /live = Luba Live (voix)
      proxy_pass http://luba;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;
    }
  }
}
